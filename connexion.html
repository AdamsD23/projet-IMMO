<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion | Accueil Immo</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-cream text-forest" data-no-assistant>
<div id="site-header"></div>

<main class="max-w-6xl mx-auto px-5 lg:px-8 pt-10 grid lg:grid-cols-2 gap-10 items-start">
    <div class="hidden lg:block relative rounded-4xl overflow-hidden h-[640px]">
        <img src="assets/img/villa-moderne.jpg" alt="" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-forest via-forest/30 to-transparent"></div>
        <div class="absolute bottom-10 left-10 right-10 text-white">
            <h2 class="text-4xl font-extrabold leading-tight">Votre espace propriétaire</h2>
            <p class="mt-3 text-white/80">Publiez vos biens, suivez les vues et répondez aux demandes de visite au même endroit.</p>
        </div>
    </div>

    <div class="bg-white rounded-4xl shadow-xl shadow-forest/5 border border-forest/5 p-6 sm:p-10">
        <div class="grid grid-cols-2 gap-1 p-1 bg-sand rounded-full" role="tablist">
            <button type="button" data-tab="login" class="py-3 rounded-full font-extrabold">Se connecter</button>
            <button type="button" data-tab="register" class="py-3 rounded-full font-extrabold">Créer un compte</button>
        </div>
        <p id="message" class="hidden mt-6 px-4 py-3 rounded-2xl text-sm font-bold"></p>

        <form id="login" class="mt-8 space-y-4">
            <label class="block"><span class="block text-sm font-extrabold mb-1">Email</span>
                <input name="email" type="email" required autocomplete="email" class="w-full px-5 py-3.5 rounded-full bg-cream outline-none focus:ring-2 focus:ring-primary"></label>
            <label class="block"><span class="block text-sm font-extrabold mb-1">Mot de passe</span>
                <input name="password" type="password" required autocomplete="current-password" class="w-full px-5 py-3.5 rounded-full bg-cream outline-none focus:ring-2 focus:ring-primary"></label>
            <button type="submit" class="w-full py-4 rounded-full bg-forest hover:bg-forest-light text-white font-extrabold transition disabled:opacity-60">Se connecter</button>
            <div id="demo" class="hidden rounded-3xl bg-sand p-4 text-sm">
                <p class="font-extrabold">Comptes de démonstration</p>
                <div class="grid sm:grid-cols-2 gap-2 mt-3">
                    <button type="button" data-demo="proprietaire@demo.ci" class="text-left px-4 py-3 rounded-2xl bg-white hover:ring-2 hover:ring-primary"><span class="block font-extrabold">Propriétaire</span><span class="text-forest/60">proprietaire@demo.ci</span></button>
                    <button type="button" data-demo="agent@demo.ci" class="text-left px-4 py-3 rounded-2xl bg-white hover:ring-2 hover:ring-primary"><span class="block font-extrabold">Agent</span><span class="text-forest/60">agent@demo.ci</span></button>
                </div>
                <p class="mt-2 text-forest/60">Mot de passe : demo12345</p>
            </div>
        </form>

        <form id="register" class="hidden mt-8 grid sm:grid-cols-2 gap-4">
            <label class="block"><span class="block text-sm font-extrabold mb-1">Prénom</span>
                <input name="prenom" required maxlength="100" autocomplete="given-name" class="w-full px-5 py-3.5 rounded-full bg-cream outline-none focus:ring-2 focus:ring-primary"></label>
            <label class="block"><span class="block text-sm font-extrabold mb-1">Nom</span>
                <input name="nom" required maxlength="100" autocomplete="family-name" class="w-full px-5 py-3.5 rounded-full bg-cream outline-none focus:ring-2 focus:ring-primary"></label>
            <label class="block"><span class="block text-sm font-extrabold mb-1">Email</span>
                <input name="email" type="email" required autocomplete="email" class="w-full px-5 py-3.5 rounded-full bg-cream outline-none focus:ring-2 focus:ring-primary"></label>
            <label class="block"><span class="block text-sm font-extrabold mb-1">Téléphone</span>
                <input name="telephone" type="tel" required autocomplete="tel" placeholder="07 00 00 00 00" class="w-full px-5 py-3.5 rounded-full bg-cream outline-none focus:ring-2 focus:ring-primary"></label>
            <label class="block sm:col-span-2"><span class="block text-sm font-extrabold mb-1">Je suis</span>
                <select name="type_utilisateur" class="w-full px-5 py-3.5 rounded-full bg-cream font-semibold outline-none focus:ring-2 focus:ring-primary">
                    <option value="proprietaire">Propriétaire (je publie mes biens)</option>
                    <option value="agent">Agent immobilier</option>
                    <option value="locataire">Locataire / acheteur</option>
                </select></label>
            <label class="block sm:col-span-2"><span class="block text-sm font-extrabold mb-1">Mot de passe (8 caractères minimum)</span>
                <input name="password" type="password" required minlength="8" autocomplete="new-password" class="w-full px-5 py-3.5 rounded-full bg-cream outline-none focus:ring-2 focus:ring-primary"></label>
            <button type="submit" class="sm:col-span-2 py-4 rounded-full bg-primary hover:bg-primary-dark text-white font-extrabold transition disabled:opacity-60">Créer mon compte</button>
        </form>
    </div>
</main>

<div id="site-footer"></div>
<script src="assets/js/app.js"></script>
<script>
    const params = Immo.params();
    const back = (params.get('retour') || 'espace.html').replace(/^[a-z]+:|\/\//gi, '');
    const msg = document.getElementById('message');
    const show = (text, error) => { msg.textContent = text; msg.className = `mt-6 px-4 py-3 rounded-2xl text-sm font-bold ${error ? 'bg-red-50 text-red-700' : 'bg-sand'}`; };
    if (params.get('message')) show(params.get('message'));

    function tab(name) {
        document.querySelectorAll('[data-tab]').forEach(b => { b.className = `py-3 rounded-full font-extrabold ${b.dataset.tab === name ? 'bg-white shadow' : 'text-forest/60'}`; });
        document.getElementById('login').classList.toggle('hidden', name !== 'login');
        document.getElementById('register').classList.toggle('hidden', name !== 'register');
    }
    document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => tab(b.dataset.tab)));
    tab(params.get('mode') === 'inscription' ? 'register' : 'login');

    if (Immo.getToken()) Immo.api('auth/me').then(() => { location.href = back; }).catch(() => {});
    Immo.api('health').then(h => { if (h.demo) document.getElementById('demo').classList.remove('hidden'); }).catch(() => {});

    async function submit(form, path, body) {
        const button = form.querySelector('[type="submit"]');
        button.disabled = true;
        try {
            const res = await Immo.api(path, { method: 'POST', body });
            Immo.saveSession(res.token, res.user);
            location.href = back;
        } catch (error) {
            show(error.message, true);
            button.disabled = false;
        }
    }

    const login = document.getElementById('login');
    login.addEventListener('submit', e => { e.preventDefault(); submit(login, 'auth/login', { email: login.email.value, password: login.password.value }); });
    login.querySelectorAll('[data-demo]').forEach(b => b.addEventListener('click', () => {
        login.email.value = b.dataset.demo; login.password.value = 'demo12345'; login.requestSubmit();
    }));

    const register = document.getElementById('register');
    register.addEventListener('submit', e => {
        e.preventDefault();
        submit(register, 'auth/register', Object.fromEntries(new FormData(register)));
    });
</script>
</body>
</html>
