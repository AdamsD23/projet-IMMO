# Déploiement sur Render : New + → Blueprint → choisir ce dépôt GitHub.
# La base peut être la même instance MySQL Aiven que Pharmacie Émeraude : une base séparée "accueil_immo" y est créée.
services:
  - type: web
    name: accueil-immo
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: DB_SSL
        value: "true"
      - key: DB_NAME
        value: accueil_immo
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
